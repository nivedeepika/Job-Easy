<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobEasy - Dashboard</title>
  <link rel="stylesheet" href="/static/anotherstyle.css" />
  <style>
    /* Basic body and layout styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    /* Header styles */
    .header {
      background-color: #2C3E50;
      color: white;
      padding: 20px;
    }

    .header .content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header img {
      height: 50px;
    }

    .header button {
      background-color: #e74c3c;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    .header button:hover {
      background-color: #c0392b;
    }

    /* Job Filter Section */
    .filter-section {
      padding: 20px;
      background-color: white;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .filter-section h2 {
      margin-bottom: 15px;
    }

    .filters input,
    .filters select {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 200px;
    }

    /* Job Cards Section */
    .job-cards {
      display: flex;
      overflow-x: auto;
      padding: 20px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .job-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      min-width: 250px;
      max-width: 300px;
      flex-shrink: 0; /* Prevent cards from shrinking */
    }

    .job-card h3 {
      font-size: 20px;
      color: #2C3E50;
      margin-bottom: 10px;
    }

    .job-card p {
      color: #555;
      margin-bottom: 10px;
    }

    .job-card button {
      background-color: #2ecc71;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
    }

    .job-card button:hover {
      background-color: #27ae60;
    }

    /* Responsive design for mobile */
    @media (max-width: 768px) {
      .job-cards {
        flex-direction: column;
        align-items: center;
      }

      .job-card {
        min-width: 100%;
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
    <div id="root">
        <div class="container">
        <header class="header">
         <div class="content">
            <img src="/static/tech.jpg" alt="Naukri Logo">
         
            <a href="{{ url_for('profile', user_id=user._id) }}">
                <button>Update Profile</button>
            </a>
        </div>
        </header>

    <!-- Job Filter Section -->
    <section class="filter-section">
      <form method="POST" action="{{ url_for('home', user_id=user._id) }}">
        <div class="filters">
          <input type="text" name="title" placeholder="Search by job title" />
          <select name="experience">
            <option value="">Experience</option>
            <option value="fresher">Fresher</option>
            <option value="1">1+ year</option>
            <option value="2">2+ years</option>
          </select>
          <select name="location">
            <option value="">Location</option>
            <option value="remote">Remote</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>
          </select>
          <button type="submit">Filter</button>
        </div>
      </form>
      
    </section>

    <!-- Job Listings -->
    <section class="job-cards">
      <h2>Latest Job Openings</h2>

      {% for job in jobs %}
      <div class="job-card">
        <h3>{{ job.title }}</h3>
        <p><strong>Description:</strong>{{job.description}}</p>
        <p><strong>Location:</strong> {{ job.location}}</p>
        
        <!-- Apply Button -->
        <form method="POST" action="{{ url_for('apply_job') }}">
          <input type="hidden" name="job_id" value="{{ job._id }}">
          <input type="hidden" name="user_id" value="{{ user._id }}">
          <button type="submit">Apply</button>
      </form>
      
      </div>
      {% endfor %}
    </section>
  </div>
  </div>
</body>
</html>
